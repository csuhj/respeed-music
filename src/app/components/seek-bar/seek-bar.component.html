<div class="seek-bar">
  <span class="time current">{{ formatDuration(vm().position) }}</span>
  <input
    class="slider"
    type="range"
    min="0"
    [max]="vm().duration"
    step="0.1"
    [value]="displayValue"
    [style]="{'--pct': progressPct}"
    (input)="onInput($event)"
    (change)="onCommit($event)"
    [disabled]="vm().disabled"
  />
  <span class="time total">{{ formatDuration(vm().duration) }}</span>
</div>
