<div
  class="waveform-wrap"
  #wrap
  [class.clickable]="!!buffer()"
  (click)="onWrapClick($event)"
>
  <canvas #canvas class="waveform-canvas"></canvas>

  @if (vm().duration > 0) {
    <div
      class="loop-overlay"
      [class.active]="vm().loopEnabled"
      [style.left.%]="loopStartPct"
      [style.width.%]="loopWidthPct"
    ></div>

    <div class="playhead" [style.left.%]="positionPct"></div>
  }

  @if (!buffer()) {
    <div class="empty-state">Load a file to see waveform</div>
  }
</div>
