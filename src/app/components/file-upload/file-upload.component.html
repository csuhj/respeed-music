<div
  class="upload-zone"
  [class.drag-over]="isDragOver"
  [class.loaded]="vm().isLoaded"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
  role="button"
  tabindex="0"
  (keydown.enter)="fileInput.click()"
  (keydown.space)="fileInput.click()"
  aria-label="Upload audio file"
>
  <input
    #fileInput
    type="file"
    accept="audio/*,.mp3,.wav,.flac,.ogg,.aac,.m4a,.webm,.mp4"
    class="hidden-input"
    (change)="onFileSelected($event)"
  />

  @if (!vm().isLoaded) {
    <div class="prompt">
      <span class="icon">♪</span>
      <p class="primary-text">Drop an audio file here</p>
      <p class="secondary-text">or click to browse</p>
      <p class="formats">MP3 · WAV · FLAC · OGG · AAC · WebM</p>
    </div>
  } @else {
    <div class="loaded-info">
      <span class="icon">♪</span>
      <p class="file-name">{{ vm().fileName }}</p>
      <p class="file-duration">{{ formatDuration(vm().duration) }}</p>
      <p class="change-hint">Click or drop to load a different file</p>
    </div>
  }
</div>

@if (vm().error) {
  <p class="error-message">{{ vm().error }}</p>
}
